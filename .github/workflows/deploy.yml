name: Deploy website

on:
  push:
    branches: [main]        # run when something lands in main
  pull_request:
    branches: [main]        # NEW: also run when a PR asks to go into main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ---------- STAGE 1: TEST (runs on PRs and on main) ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          test -f site/index.html
          echo "✅ index.html found"

      - name: Check the page has a title
        run: |
          grep -q "<title>" site/index.html
          echo "✅ Title tag found"

      - name: Check the page shows a version
        run: |
          grep -q "Version" site/index.html
          echo "✅ Version text found"

      - name: Check no leftover TODO notes
        run: |
          if grep -qi "TODO" site/index.html; then
            echo "❌ Found TODO in index.html - finish it before deploying"
            exit 1
          fi
          echo "✅ No TODOs"

  # ---------- STAGE 2: DEPLOY (only after merge to main) ----------
  deploy:
    needs: test
    if: github.event_name == 'push'     # NEW: never deploy from a PR, only from main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Package the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
